# Which mods each release publishes to the in-game mod catalog (the F1 mod
# manager's "All" tab). Every mod under src/ is still built and attached to
# the release; only the ids listed here end up in catalog.json, so this is
# the place to cherry-pick. Ids in `featured` are sorted to the top of the tab
# and must also appear in `published`.
published = [
    "blackboard",
    "bus_inspector",
    "foxy_jumpscare",
    "fruit",
    "game_symbols",
    "graphics_settings",
    "item_inspector",
    "memory_peek",
    "music_player",
    "player_stats",
    "psx_buttons",
    "ui_color",
]
featured = []
